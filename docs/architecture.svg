<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="860" height="300" fill="#0d1117"/>

  <!-- PC box -->
  <rect x="20" y="30" width="360" height="240" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="200" y="56" fill="#8b949e" font-size="12" text-anchor="middle">WINDOWS PC</text>

  <rect x="45" y="75" width="310" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="200" y="97" fill="#e6edf3" font-size="12" text-anchor="middle">ddagrab (Desktop Duplication)</text>

  <rect x="45" y="125" width="145" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="117" y="147" fill="#e6edf3" font-size="12" text-anchor="middle">h264_nvenc</text>

  <rect x="210" y="125" width="145" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="282" y="147" fill="#e6edf3" font-size="12" text-anchor="middle">mjpeg</text>

  <rect x="45" y="180" width="310" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="200" y="202" fill="#e6edf3" font-size="12" text-anchor="middle">Node.js  HTTP/HTTPS + WebSocket</text>

  <line x1="200" y1="109" x2="117" y2="125" stroke="#484f58" stroke-width="1.5"/>
  <line x1="200" y1="109" x2="282" y2="125" stroke="#484f58" stroke-width="1.5"/>
  <line x1="117" y1="159" x2="200" y2="180" stroke="#484f58" stroke-width="1.5"/>
  <line x1="282" y1="159" x2="200" y2="180" stroke="#484f58" stroke-width="1.5"/>

  <!-- arrows -->
  <line x1="380" y1="140" x2="470" y2="140" stroke="#3fb950" stroke-width="2"/>
  <polygon points="470,140 460,135 460,145" fill="#3fb950"/>
  <text x="425" y="130" fill="#3fb950" font-size="11" text-anchor="middle">wss</text>

  <line x1="380" y1="205" x2="470" y2="205" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="470,205 460,200 460,210" fill="#58a6ff"/>
  <text x="425" y="195" fill="#58a6ff" font-size="11" text-anchor="middle">https</text>

  <!-- iPad -->
  <rect x="480" y="30" width="360" height="240" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="660" y="56" fill="#8b949e" font-size="12" text-anchor="middle">iPAD · SAFARI</text>

  <rect x="505" y="90" width="310" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="660" y="112" fill="#e6edf3" font-size="12" text-anchor="middle">WebCodecs → canvas</text>
  <text x="660" y="145" fill="#3fb950" font-size="11" text-anchor="middle">30–80 ms · ~3 Mbps</text>

  <line x1="505" y1="158" x2="815" y2="158" stroke="#30363d" stroke-dasharray="3 3"/>

  <rect x="505" y="172" width="310" height="34" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="660" y="194" fill="#e6edf3" font-size="12" text-anchor="middle">&lt;img&gt; multipart stream</text>
  <text x="660" y="227" fill="#58a6ff" font-size="11" text-anchor="middle">works back to iOS 6</text>

  <text x="660" y="255" fill="#6e7681" font-size="10" text-anchor="middle">same server, picked by capability detection</text>
</svg>
